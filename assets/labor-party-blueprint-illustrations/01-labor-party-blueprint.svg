<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">The Australian Labor Party as a blueprint elevation drawing</title>
  <desc id="d">An engineering elevation of a building labelled Australian Labor Party stands left of a dash-dot centerline. Its foundation is labelled unions and 1891 strikes; its floors are NDIS, super, Medicare and fair wages. Pivot, a living drafting compass, spreads its legs to measure the gap between the building and the centerline, dimensioned as centre-left. A detail bubble shows the word Labour with the U struck out, revised 1912 to Labor. A dashed rival site right of the centerline is labelled the Coalition. A red stamp reads in power since 2022.</desc>

  <g id="bg">
    <rect width="1920" height="1080" fill="#143A66"/>
    <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" fill="none">
      <path d="M 96 0 V 1080 M 192 0 V 1080 M 288 0 V 1080 M 384 0 V 1080 M 480 0 V 1080 M 576 0 V 1080 M 672 0 V 1080 M 768 0 V 1080 M 864 0 V 1080 M 960 0 V 1080 M 1056 0 V 1080 M 1152 0 V 1080 M 1248 0 V 1080 M 1344 0 V 1080 M 1440 0 V 1080 M 1536 0 V 1080 M 1632 0 V 1080 M 1728 0 V 1080 M 1824 0 V 1080"/>
      <path d="M 0 90 H 1920 M 0 180 H 1920 M 0 270 H 1920 M 0 360 H 1920 M 0 450 H 1920 M 0 540 H 1920 M 0 630 H 1920 M 0 720 H 1920 M 0 810 H 1920 M 0 900 H 1920 M 0 990 H 1920"/>
    </g>
  </g>

  <g id="furniture">
    <g id="detail-a" transform="translate(210 240)" data-anim="pop" data-order="12">
      <circle r="120" fill="none" stroke="#F2F6FA" stroke-width="2.5"/>
      <text y="-140" text-anchor="middle" font-family="'Architects Daughter','Segoe Print',cursive" font-size="22" fill="#F2F6FA">DETAIL A</text>
      <text x="24" y="-4" text-anchor="end" font-family="'Architects Daughter','Segoe Print',cursive" font-size="34" fill="#F2F6FA">LABO</text>
      <text x="42" y="-4" text-anchor="middle" font-family="'Architects Daughter','Segoe Print',cursive" font-size="34" fill="#F2F6FA">U</text>
      <text x="60" y="-4" text-anchor="start" font-family="'Architects Daughter','Segoe Print',cursive" font-size="34" fill="#F2F6FA">R</text>
      <path d="M 28 -32 L 56 -2 M 56 -32 L 28 -2" stroke="#E5484D" stroke-width="3" fill="none"/>
      <text y="52" text-anchor="middle" font-family="'Architects Daughter','Segoe Print',cursive" font-size="24" fill="#F2F6FA">NOW: LABOR</text>
    </g>
    <g id="stamp-2022" transform="translate(1560 260) rotate(-9)" data-anim="pop" data-order="13">
      <circle r="92" fill="none" stroke="#E5484D" stroke-width="3"/>
      <circle r="76" fill="none" stroke="#E5484D" stroke-width="1.5"/>
      <text y="-8" text-anchor="middle" font-family="'Architects Daughter','Segoe Print',cursive" font-size="18" fill="#E5484D">IN POWER</text>
      <text y="20" text-anchor="middle" font-family="'Architects Daughter','Segoe Print',cursive" font-size="16" fill="#E5484D">SINCE 2022</text>
    </g>
    <g id="title-block" transform="translate(1640 990)" data-anim="fade" data-order="14">
      <rect x="-160" y="-54" width="320" height="108" fill="none" stroke="#F2F6FA" stroke-width="2"/>
      <path d="M -160 -18 H 160 M -160 18 H 160" stroke="#F2F6FA" stroke-width="1.5" fill="none"/>
      <text y="-28" text-anchor="middle" font-family="'Architects Daughter','Segoe Print',cursive" font-size="20" fill="#F2F6FA">LABOR PARTY (AUS)</text>
      <text y="4" text-anchor="middle" font-family="'Architects Daughter','Segoe Print',cursive" font-size="16" fill="#F2F6FA">DWG NO. ALP-1891</text>
      <text y="38" text-anchor="middle" font-family="'Architects Daughter','Segoe Print',cursive" font-size="14" fill="#F2F6FA">SCALE: 1 VOTE = 1 VOICE</text>
    </g>
  </g>

  <g id="structure">
    <g id="ground" transform="translate(960 880)" data-anim="draw" data-order="1">
      <path d="M -840 2 Q -560 -4 -260 1 T 340 -1 T 840 2" fill="none" stroke="#F2F6FA" stroke-width="3" pathLength="1"/>
    </g>
    <g id="foundation" transform="translate(620 921)" data-anim="fade" data-order="2">
      <path d="M -280 -41 C -140 -43 60 -39 280 -41 L 280 41 C 120 43 -80 39 -280 41 Z" fill="none" stroke="#F2F6FA" stroke-width="3"/>
      <path d="M -240 41 L -198 -41 M -150 41 L -108 -41 M -60 41 L -18 -41 M 120 41 L 162 -41 M 210 41 L 252 -41" stroke="#F2F6FA" stroke-width="1.5" fill="none"/>
      <text y="9" text-anchor="middle" font-family="'Architects Daughter','Segoe Print',cursive" font-size="26" fill="#F2F6FA">UNIONS &#183; 1891 STRIKES</text>
    </g>
    <g id="building" transform="translate(620 590)" data-anim="draw" data-order="3">
      <path d="M -260 290 C -262 196 -258 100 -261 6 C -259 -92 -262 -188 -260 -290 C -174 -288 -88 -291 0 -289 C 88 -291 174 -288 260 -290 C 258 -194 261 -98 259 -2 C 261 94 258 192 260 290" fill="none" stroke="#F2F6FA" stroke-width="3" pathLength="1"/>
      <path d="M -272 -290 C -180 -292 -90 -288 0 -290 C 90 -292 182 -289 272 -290" fill="none" stroke="#F2F6FA" stroke-width="3"/>
      <path d="M -260 -160 C -120 -162 60 -158 260 -160" fill="none" stroke="#F2F6FA" stroke-width="2"/>
      <path d="M -260 -48 C -120 -50 60 -46 260 -48" fill="none" stroke="#F2F6FA" stroke-width="2"/>
      <path d="M -260 65 C -120 63 60 67 260 65" fill="none" stroke="#F2F6FA" stroke-width="2"/>
      <path d="M -260 178 C -120 176 60 180 260 178" fill="none" stroke="#F2F6FA" stroke-width="2"/>
      <text y="-234" text-anchor="middle" font-family="'Architects Daughter','Segoe Print',cursive" font-size="26" fill="#F2F6FA">AUSTRALIAN LABOR PARTY</text>
      <text y="-196" text-anchor="middle" font-family="'Architects Daughter','Segoe Print',cursive" font-size="20" fill="#F2F6FA">EST. 1891</text>
      <text x="-230" y="-96" font-family="'Architects Daughter','Segoe Print',cursive" font-size="26" fill="#F2F6FA">NDIS</text>
      <text x="-230" y="16" font-family="'Architects Daughter','Segoe Print',cursive" font-size="26" fill="#F2F6FA">SUPER</text>
      <text x="-230" y="129" font-family="'Architects Daughter','Segoe Print',cursive" font-size="26" fill="#F2F6FA">MEDICARE</text>
      <text x="-230" y="242" font-family="'Architects Daughter','Segoe Print',cursive" font-size="26" fill="#F2F6FA">FAIR WAGES</text>
      <rect x="150" y="-122" width="36" height="36" fill="none" stroke="#F2F6FA" stroke-width="1.5"/>
      <rect x="150" y="-10" width="36" height="36" fill="none" stroke="#F2F6FA" stroke-width="1.5"/>
      <rect x="150" y="103" width="36" height="36" fill="none" stroke="#F2F6FA" stroke-width="1.5"/>
      <rect x="150" y="216" width="36" height="36" fill="none" stroke="#F2F6FA" stroke-width="1.5"/>
      <path d="M -30 290 V 240 Q 0 216 30 240 V 290" fill="none" stroke="#F2F6FA" stroke-width="2"/>
    </g>
    <g id="centerline" transform="translate(1180 570)" data-anim="draw" data-order="4">
      <path d="M 0 -440 V 440" fill="none" stroke="#F2F6FA" stroke-width="2" stroke-dasharray="34 10 4 10" pathLength="1"/>
      <text x="14" y="-410" font-family="'Architects Daughter','Segoe Print',cursive" font-size="24" fill="#F2F6FA">CL</text>
    </g>
    <g id="dim-centre-left" transform="translate(1030 560)" data-anim="draw" data-order="5">
      <path d="M -150 -14 V 14 M 150 -14 V 14" stroke="#F2F6FA" stroke-width="2" fill="none"/>
      <path d="M -150 0 H 150" stroke="#F2F6FA" stroke-width="2" fill="none" pathLength="1"/>
      <path d="M -150 0 l 16 -7 M -150 0 l 16 7 M 150 0 l -16 -7 M 150 0 l -16 7" stroke="#F2F6FA" stroke-width="2" fill="none"/>
      <text y="-18" text-anchor="middle" font-family="'Architects Daughter','Segoe Print',cursive" font-size="28" fill="#F2F6FA">CENTRE-LEFT</text>
    </g>
    <g id="coalition-ghost" transform="translate(1520 700)" data-anim="fade" data-order="6">
      <path d="M -190 180 V -180 H 190 V 180" fill="none" stroke="#F2F6FA" stroke-width="2" stroke-dasharray="16 12"/>
      <text y="-6" text-anchor="middle" font-family="'Architects Daughter','Segoe Print',cursive" font-size="26" fill="#F2F6FA">THE COALITION</text>
      <text y="28" text-anchor="middle" font-family="'Architects Daughter','Segoe Print',cursive" font-size="20" fill="#F2F6FA">(RIVAL SITE)</text>
    </g>
  </g>

  <g id="flows">
    <g id="flow-votes" transform="translate(222 839)" data-anim="draw" data-order="7">
      <path d="M -122 -19 C -50 -49 40 -39 122 19" fill="none" stroke="#FFB224" stroke-width="3" stroke-dasharray="14 10" pathLength="1"/>
      <path d="M 122 19 L 100 11 M 122 19 L 108 33" fill="none" stroke="#FFB224" stroke-width="3"/>
    </g>
  </g>

  <g id="pivot" transform="translate(1030 700)" data-anim="fade" data-order="8">
    <g id="pivot-body">
      <ellipse cy="-52" rx="12" ry="5" fill="none" stroke="#F2F6FA" stroke-width="2.5"/>
      <path d="M 0 -47 V -30" stroke="#F2F6FA" stroke-width="3" fill="none"/>
      <circle r="30" fill="none" stroke="#F2F6FA" stroke-width="3"/>
      <path d="M -16 26 L 16 26 L 11 42 L -11 42 Z" fill="none" stroke="#F2F6FA" stroke-width="2.5"/>
      <g id="pivot-eyes">
        <circle cx="-10" cy="-6" r="5" fill="#F2F6FA"/>
        <circle cx="10" cy="-6" r="5" fill="#F2F6FA"/>
      </g>
    </g>
    <g id="pivot-needle-leg">
      <path d="M -11 40 L -118 140" fill="none" stroke="#F2F6FA" stroke-width="6"/>
      <path d="M -118 140 L -150 168" fill="none" stroke="#F2F6FA" stroke-width="2"/>
    </g>
    <g id="pivot-pencil-leg">
      <path d="M 11 40 L 112 136" fill="none" stroke="#F2F6FA" stroke-width="6"/>
      <path d="M 104 128 L 124 118" fill="none" stroke="#F2F6FA" stroke-width="2.5"/>
      <path d="M 112 136 L 150 168 L 108 156 Z" fill="#F2F6FA"/>
    </g>
  </g>

  <g id="annotations">
    <g id="note-rev" transform="translate(210 424)" data-anim="fade" data-order="9">
      <text text-anchor="middle" font-family="'Architects Daughter','Segoe Print',cursive" font-size="26" fill="#E5484D">REV 1912:</text>
      <text y="34" text-anchor="middle" font-family="'Architects Daughter','Segoe Print',cursive" font-size="26" fill="#E5484D">'U' REMOVED</text>
      <path d="M 0 -30 V -56 M 0 -56 L -7 -44 M 0 -56 L 7 -44" fill="none" stroke="#E5484D" stroke-width="2" pathLength="1"/>
    </g>
    <g id="note-votes" transform="translate(60 740)" data-anim="fade" data-order="10">
      <text font-family="'Architects Daughter','Segoe Print',cursive" font-size="28" fill="#FFB224">WORKERS' VOTES</text>
    </g>
    <g id="note-oldest" transform="translate(620 1028)" data-anim="fade" data-order="11">
      <text text-anchor="middle" font-family="'Architects Daughter','Segoe Print',cursive" font-size="26" fill="#F2F6FA">OLDEST LABOUR PARTY ON EARTH</text>
      <path d="M 0 -34 V -56 M 0 -56 L -7 -44 M 0 -56 L 7 -44" fill="none" stroke="#F2F6FA" stroke-width="2"/>
    </g>
  </g>
</svg>
