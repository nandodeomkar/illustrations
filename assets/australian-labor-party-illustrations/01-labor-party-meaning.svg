<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="alp-t alp-d">
  <title id="alp-t">The Australian Labor Party explained as a hand-drawn tree</title>
  <desc id="alp-d">A tree labelled ALP grows from roots labelled unions, strikes and workers; its fruits are Medicare, fair wages, super and NDIS. A small black creature waters the roots with a can labelled votes. Notes explain Labor is centre-left, one of the two major parties, dropped the letter u in 1912, and is the world's oldest labour party, in government since 2022.</desc>
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="958" height="538" fill="#ffffff" stroke="#e8e8e8" stroke-width="1" rx="6"/>

  <!-- hand-drawn line art -->
  <g filter="url(#rough)" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground -->
    <path d="M 60 401 Q 200 396 340 401 T 620 399 T 900 402"/>
    <path d="M 150 400 l 3 -9 l 3 9 M 158 400 l 4 -6"/>
    <path d="M 560 400 l 3 -8 l 3 8"/>
    <path d="M 730 400 l 3 -9 l 3 9 M 738 400 l 4 -6"/>
    <path d="M 845 400 l 3 -7 l 3 7"/>
    <!-- trunk -->
    <path d="M 372 400 C 376 368 368 330 376 296 C 378 282 374 270 370 258"/>
    <path d="M 402 400 C 398 366 406 328 398 294 C 396 282 400 270 404 258"/>
    <!-- carving on trunk -->
    <ellipse cx="387" cy="338" rx="21" ry="13"/>
    <!-- canopy -->
    <path d="M 262 232 C 240 218 238 192 254 178 C 244 156 258 134 282 132 C 288 110 316 100 336 110 C 348 92 380 88 396 102 C 412 88 444 90 456 106 C 480 98 506 112 508 134 C 530 142 538 166 526 184 C 540 200 532 224 512 232 C 502 250 478 256 462 246 C 448 262 420 264 404 250 C 390 264 362 264 348 250 C 330 262 302 258 292 244 C 278 248 266 242 262 232 Z"/>
    <!-- fruits with stems -->
    <path d="M 302 152 C 303 158 302 163 302 168"/>
    <circle cx="302" cy="192" r="26"/>
    <path d="M 392 112 C 393 117 392 121 392 125"/>
    <circle cx="392" cy="150" r="26"/>
    <path d="M 468 162 C 469 167 468 171 468 174"/>
    <circle cx="468" cy="196" r="23"/>
    <circle cx="390" cy="228" r="18"/>
    <!-- roots -->
    <path d="M 374 400 C 348 424 312 438 276 452 C 258 460 244 468 234 478"/>
    <path d="M 300 442 C 292 452 288 460 286 468"/>
    <path d="M 386 402 C 384 432 392 458 388 484"/>
    <path d="M 389 440 C 396 450 398 458 397 466"/>
    <path d="M 400 400 C 426 426 458 440 492 456 C 506 462 516 470 524 480"/>
    <!-- dropped letter U lying on the ground -->
    <text x="268" y="394" transform="rotate(106 282 382)" font-family="'Segoe Print','Bradley Hand',cursive" font-size="44" fill="#1f1f1f" stroke="none">U</text>
    <!-- xiaohei body -->
    <path d="M 614 394 C 606 366 604 334 611 314 C 616 298 631 292 642 294 C 656 296 664 308 666 324 C 668 348 666 372 659 394 Z" fill="#1f1f1f"/>
    <path d="M 626 394 L 624 404 M 651 394 L 653 404"/>
    <path d="M 612 334 C 600 328 584 318 570 308"/>
    <path d="M 614 350 C 602 344 588 334 574 324"/>
    <!-- watering can -->
    <g transform="translate(540 290) rotate(-20)">
      <rect x="-30" y="-14" width="62" height="32" rx="6" fill="#ffffff"/>
      <path d="M -6 -14 C -4 -28 18 -28 20 -14"/>
      <path d="M -30 -4 C -42 -10 -50 -16 -56 -22 M -30 8 C -44 0 -54 -8 -60 -16 M -56 -22 L -60 -16"/>
    </g>
  </g>

  <!-- water of votes (orange flow) -->
  <g fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round">
    <path d="M 482 268 C 452 298 430 340 416 386" stroke-dasharray="1 9"/>
    <ellipse cx="464" cy="290" rx="2" ry="4" fill="#e8590c" stroke="none" transform="rotate(35 464 290)"/>
    <ellipse cx="442" cy="322" rx="2" ry="4" fill="#e8590c" stroke="none" transform="rotate(25 442 322)"/>
    <ellipse cx="426" cy="356" rx="2" ry="4" fill="#e8590c" stroke="none" transform="rotate(15 426 356)"/>
  </g>

  <!-- annotation arrows -->
  <g fill="none" stroke-width="1.5" stroke-linecap="round">
    <path d="M 228 346 C 250 358 262 366 272 374 M 272 374 L 263 372 M 272 374 L 268 365" stroke="#d62828"/>
    <path d="M 252 452 C 246 462 242 468 238 474 M 238 474 L 240 466 M 238 474 L 245 471" stroke="#1c7ed6"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe Print','Bradley Hand',cursive" fill="#1f1f1f">
    <text x="388" y="66" font-size="18" text-anchor="middle">the Australian Labor Party (ALP)</text>
    <text x="387" y="343" font-size="12" text-anchor="middle">ALP</text>
    <text x="302" y="196" font-size="11" text-anchor="middle">Medicare</text>
    <text x="392" y="147" font-size="11" text-anchor="middle">fair</text>
    <text x="392" y="160" font-size="11" text-anchor="middle">wages</text>
    <text x="468" y="200" font-size="11" text-anchor="middle">super</text>
    <text x="390" y="232" font-size="10" text-anchor="middle">NDIS</text>
    <text x="236" y="496" font-size="12" text-anchor="middle">unions</text>
    <text x="392" y="502" font-size="12" text-anchor="middle">strikes</text>
    <text x="522" y="498" font-size="12" text-anchor="middle">workers</text>
    <text x="540" y="296" font-size="11" text-anchor="middle" transform="rotate(-20 540 296)">votes</text>
    <text x="700" y="92" font-size="14" text-anchor="middle" fill="#d62828">centre-left — one of the two majors</text>
    <text x="700" y="112" font-size="12" text-anchor="middle" fill="#1c7ed6">(the other: the Liberal–National Coalition)</text>
    <text x="700" y="138" font-size="12" text-anchor="middle" fill="#1c7ed6">in government since 2022</text>
    <text x="96" y="318" font-size="13" fill="#d62828">dropped its 'u' in 1912 —</text>
    <text x="96" y="337" font-size="13" fill="#d62828">officially spelt 'Labor'</text>
    <text x="70" y="447" font-size="12" fill="#1c7ed6">roots: the 1891 shearers' strikes —</text>
    <text x="70" y="466" font-size="12" fill="#1c7ed6">the world's oldest labour party</text>
  </g>

  <!-- xiaohei eyes -->
  <circle cx="630" cy="320" r="4" fill="#ffffff"/>
  <circle cx="648" cy="322" r="4" fill="#ffffff"/>
</svg>
